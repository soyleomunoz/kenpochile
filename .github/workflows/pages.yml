# Despliegue explícito de GitHub Pages.
#
# Reemplaza el build clásico (rama -> Pages), que falla en silencio: cuando el
# deployment se cae no aparece en la pestaña Actions y no llega ningún aviso, así
# que el sitio queda sirviendo la versión anterior sin que nadie se entere.
# Con este workflow cada publicación queda registrada en Actions y GitHub envía
# un correo al autor del commit si la ejecución falla.
#
# Requiere: Settings -> Pages -> Source = "GitHub Actions".
name: Desplegar sitio en GitHub Pages

on:
  push:
    branches: [main]
  # Permite relanzar el despliegue a mano desde la pestaña Actions sin tener que
  # inventar un commit vacío.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deja terminar el despliegue en curso y encola solo el último push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Genera una página con vista previa propia (Open Graph) por cada entrada de blog,
      # escuela, maestro y cinturón de color: kenpochile.cl/blog/<id>/, /escuela/<id>/,
      # /maestro/<id>/ y /cinturon/<id>/. WhatsApp y Facebook no leen el "#" de los
      # deep-links (kenpochile.cl/#blog=<id>) y mostrarían la vista previa genérica.
      # También regenera sitemap.xml. Los resultados también se versionan (ver tools/).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Generar páginas para compartir
        working-directory: tools
        run: |
          npm ci
          node generar-paginas-compartir.mjs
          # node_modules no debe viajar al sitio publicado.
          rm -rf node_modules

      # El resto del sitio es estático: se publica el repositorio tal cual.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
